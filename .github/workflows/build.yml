name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas do Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Descompactar
        run: unzip -q leve-x-android.zip
      - name: Compilar
        working-directory: leve-x-android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LeveX-apk
          path: leve-x-android/app/build/outputs/apk/debug/app-debug.apk
